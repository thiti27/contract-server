<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The Contract Requisition Form template (templates/Contract Requisition Form.xlsx) is
  styled in Tahoma throughout — a Microsoft font this Debian-based image doesn't have.
  Without a substitution, LibreOffice would fall back to whatever generic sans-serif
  fontconfig picks, which typically has no Thai glyphs at all, rendering the form's Thai
  labels as tofu boxes in the generated PDF. This tells fontconfig to serve "Waree" (from
  the fonts-thai-tlwg package installed in the Dockerfile) whenever Tahoma is requested,
  so both the Thai and Latin text on the form render as real glyphs.
-->
<fontconfig>
  <alias>
    <family>Tahoma</family>
    <prefer>
      <family>Waree</family>
    </prefer>
  </alias>
</fontconfig>
